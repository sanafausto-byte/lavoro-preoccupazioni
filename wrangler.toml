name = "lavoro-preoccupazioni"
main = "src.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "lavoro-preoccupazioni"
database_id = "INSERISCI_QUI_DATABASE_ID"
migrations_dir = "migrations"

[vars]
ADMIN_EMAIL = "info@faustosana.it"
